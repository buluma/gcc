# Run the same required gate as local development on the supported Node runtime.

name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use the supported Node.js runtime
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.0
    - run: bun install --frozen-lockfile
    - run: bun run check
